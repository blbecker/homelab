name: homelab-docs

services:
  volumeinit:
    image: busybox
    command: chown -R 1000:1000 /data
    volumes:
      - hugo_cache:/data

  hugo:
    image: hugomods/hugo:go-git-0.159.1
    command: server -D
    volumes:
      - ./:/src
      - hugo_cache:/tmp/hugo_cache
    working_dir: /src/site
    user: 1000:1000
    ports:
      - 1313:1313
    depends_on:
      volumeinit:
        condition: service_completed_successfully

volumes:
  hugo_cache:
