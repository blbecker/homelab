name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read # Required to access repository content
  pull-requests: read # Required to access the pull request data

env:
  tf_version: "1.12.2"
  tg_version: "0.85.0"
  working_dir: "terraform"

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}
      flux: ${{ steps.filter.outputs.flux }}
      docs: ${{ steps.filter.outputs.docs }}

    # Set job outputs to values from filter step
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/**' # Run CI jobs if workflows change
            ansible:
              - 'ansible/**'
              - '.github/**'
            flux:
              - 'flux/**'
              - '.github/**'
            docs:
              - 'docs/**'
              - '.github/**'
  # Job to run Gitleaks
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kube-conform:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yannh/kubeconform:v0.7.0-alpine
      volumes:
        # Mount the host directory into the container
        - ${{ github.workspace }}:/data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run kube-conform on Kubernetes manifests
        run: |
          /kubeconform -summary -ignore-missing-schemas -ignore-filename-pattern '/files/' -output json /data/flux/

  # We've got some work to do before kube score will pass
  #
  # kube-score:
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   container:
  #     image: zegl/kube-score:v1.19.0
  #     volumes:
  #       # Mount the host directory into the container
  #       - ${{ github.workspace }}:/data
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Run kube-score on Kubernetes manifests
  #       run: |
  #         /data/scripts/do-kube-score.sh --ignore-test container-ephemeral-storage-request-and-limit --ignore-test container-security-context-user-group-id --ignore-test pod-networkpolicy --ignore-test container-security-context-readonlyrootfilesystem --output-format human

  # Job to lint Ansible playbooks in "ansible" directory
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run ansible-lint
        uses: ansible/ansible-lint@main # or vX.X.X version
        with:
          args: "--exclude '**/tests/**' --exclude '**/secrets.yml'"
          setup_python: "true"
          python_version: "3.14"
          working_directory: "ansible"

  tflint:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v6
        name: Checkout source code

      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.60.0
          cache: true

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --chdir terraform/ -f compact --recursive

  git-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    needs:
      - gitleaks
      - kube-conform
      - ansible-lint
      - tflint
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
        with:
          versionSpec: "6.6.x"

      - name: Determine Version
        id: version_step # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0

      - name: Create semver tags
        run: |

          TAG_MAJOR="${{ steps.version_step.outputs.major }}"
          TAG_MINOR="${TAG_MAJOR}.${{ steps.version_step.outputs.minor }}"
          TAG_PATCH="${{ steps.version_step.outputs.semVer }}"


          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -f "$TAG_MAJOR"
          git tag -f "$TAG_MINOR"
          git tag -f "$TAG_PATCH"

          git push origin "$TAG_PATCH" "$TAG_MAJOR" "$TAG_MINOR" --force

