apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: peanut
  namespace: flux-system
spec:
  interval: 15m
  path: flux/infra/peanut
  prune: true # remove any elements later removed from the above path
  timeout: 5m
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: peanut
      namespace: peanut
