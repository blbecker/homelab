apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg.crds
  namespace: flux-system
spec:
  interval: 15m
  path: flux/infra/cloudnative-pg.crds
  prune: true
  dependsOn:
    - name: cloudnative-pg
    # ObjectStore CRD comes from the plugin chart, and the Cluster/backup CRs
    # reference resources the plugin registers.
    - name: plugin-barman-cloud
  timeout: 2m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: main
      namespace: cloudnative-pg
