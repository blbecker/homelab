apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  interval: 15m
  path: flux/infra/hermes-agent
  prune: true
  dependsOn:
    - name: hermes-operator
  timeout: 2m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: agents.hermeum.app/v1alpha1
      kind: HermesAgent
      name: hermes
      namespace: hermes-agent
    - apiVersion: apps/v1
      kind: Deployment
      name: openviking
      namespace: hermes-agent
