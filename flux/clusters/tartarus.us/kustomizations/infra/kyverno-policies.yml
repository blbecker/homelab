apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno.crds
  namespace: flux-system
spec:
  interval: 15m
  path: flux/infra/kyverno.crds
  prune: true
  dependsOn:
    - name: kyverno
  timeout: 2m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
