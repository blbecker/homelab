apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-agent-dot
  namespace: flux-system
spec:
  interval: 15m
  path: flux/infra/openclaw-agent-dot
  prune: true
  dependsOn:
    - name: openclaw-operator
  timeout: 2m0s
  targetNamespace: openclaw-agent-dot
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: openclaw.rocks/v1alpha1
      kind: OpenClawInstance
      name: openclaw-agent-dot
      namespace: openclaw-agent-dot
