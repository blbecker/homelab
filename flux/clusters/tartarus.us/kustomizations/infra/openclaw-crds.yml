apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-operator.crds
  namespace: flux-system
spec:
  interval: 15m
  path: flux/infra/openclaw-operator.crds
  prune: true
  dependsOn:
    - name: openclaw-operator
  timeout: 2m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: OpenClawInstance
      name: openclaw-agent
      namespace: openclaw-operator
