apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 15m
  path: flux/apps/immich
  prune: true # remove any elements later removed from the above path
  timeout: 5m
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-server
      namespace: immich
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-machine-learning
      namespace: immich
