apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: traefik
  values: # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
    tlsStore:
      default:
        defaultCertificate:
          secretName: letsencrypt-wildcard-cert-tartarus.us-prod

    providers:
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: false
    gateway:
      enabled: false

    log:
      level: INFO
    accessLog:
      enabled: true

    # Prometheus metrics on the `metrics` entrypoint (ports.metrics = 9100, in-cluster only).
    # Scraped through the chart's own dedicated metrics Service + ServiceMonitor, so 9100 never
    # lands on the LoadBalancer Service and there is no hand-rolled ServiceMonitor to drift.
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addServicesLabels: true
        # Routers labels stay off: one series per router x protocol x code multiplies cardinality
        # for detail we can already get from the (fewer) service-level series.
        addRoutersLabels: false
        # Chart default is "0.1,0.3,1.2,5.0": a p99 interpolated across the 1.2 -> 5.0 gap is a
        # guess, which makes both the latency panel and the >3s alert meaningless. Costs ~70 extra
        # bucket series (~315 total for this job).
        buckets: "0.05,0.1,0.25,0.5,1,2.5,5,10"
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          # Same namespace as every other ServiceMonitor in this repo; the chart still points
          # namespaceSelector at the traefik namespace, which is where the Service lives.
          namespace: prometheus-operator
          additionalLabels:
            # kube-prometheus-stack's default serviceMonitorSelector (release name)
            release: prometheus-operator

    service:
      loadBalancerIP: 192.168.40.84
