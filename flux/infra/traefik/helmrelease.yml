apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      version: 39.0.7
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: traefik
  values: # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
    tlsStore:
      default:
        defaultCertificate:
          secretName: letsencrypt-wildcard-cert-tartarus.us-prod

    providers:
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: false
    gateway:
      enabled: false

    logs:
      general:
        level: INFO
      access:
        enabled: true

    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80

      websecure:
        port: 443
        expose:
          default: true
        exposedPort: 443

    service:
      loadBalancerIP: 192.168.40.84
