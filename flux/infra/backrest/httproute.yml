apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backrest-web-route
  namespace: backrest
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik

  hostnames:
    - backrest.tartarus.us

  rules:
    # Multihost sync: HTTP/2 cleartext
    - matches:
        - path:
            type: PathPrefix
            value: /v1sync.BackrestSyncService/
      backendRefs:
        - name: backrest-sync
          port: 9898

    # Everything else: HTTP/1.1 backend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backrest
          port: 9898
