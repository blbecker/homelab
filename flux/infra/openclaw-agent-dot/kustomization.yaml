apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openclaw-agent-dot
resources:
  - ./openclaw-agent.yml
  - gog-config-pvc.yml
  - https-redirect-middleware.yml
  - ingressroute.yaml
  - reflect-prod-cert.yml
configMapGenerator:
  - name: openclaw-agent-config
    files:
      - files/openclaw.json
generatorOptions:
  disableNameSuffixHash: true
