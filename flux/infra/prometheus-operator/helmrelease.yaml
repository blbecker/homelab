apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: prometheus-operator
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 83.7.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: prometheus-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    grafana:
      enabled: true
