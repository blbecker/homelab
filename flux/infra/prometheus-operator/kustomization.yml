apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus-operator
resources:
  - alertmanagerconfig.yml
  - helmrelease.yaml 
  - httproute-alertmanager.yml 
  - httproute-grafana.yml 
  - httproute-prometheus.yml 
  - mikrotik-service-monitor.yml 
  - snmp_exporter.yml 
  - snmp_exporter_svc.yml 
  - service-monitors/peanut.yml
  - service-monitors/longhorn.yml
  - rules/longhorn.yml
  - rules/traefik.yml

configMapGenerator:
  - name: smarthome-dashboard
    files:
      - files/dashboards/smarthome.json
  - name: longhorn-dashboard
    files:
      - files/dashboards/longhorn.json
  - name: traefik-dashboard
    files:
      - files/dashboards/traefik.json

generatorOptions:
  labels:
    grafana_dashboard: "1"

