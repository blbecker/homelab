# CloudNativePG is scraped through PodMonitors rather than the operator's
# built-in `spec.monitoring.enablePodMonitor`, which is deprecated in CNPG 1.30
# ("this feature will be removed in an upcoming release ... create a PodMonitor
# manually"). Both monitors live in prometheus-operator with the release label so
# they match the Prometheus podMonitorSelector, and select across namespaces the
# same way service-monitors/longhorn.yml does.
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudnative-pg-instances
  namespace: prometheus-operator
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - cloudnative-pg
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    # cnpg_collector_* (WAL, fencing, collection errors, per-database stats)
    # and the plugin's backup metrics barman_cloud_cloudnative_pg_io_*
    # (last_failed_backup_timestamp, last_available_backup_timestamp,
    # first_recoverability_point) are all served by the instance manager here.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Metric curation tier S1 (metrics-policy.md): the Go runtime of the instance manager. 105 of
      # this job's 2,164 series; every cnpg_collector_* and barman_cloud_* family is untouched.
      metricRelabelings:
        - action: drop
          sourceLabels:
            - __name__
          regex: "go_.*|process_cpu_seconds_total|process_open_fds|process_max_fds|process_virtual_memory_bytes|process_start_time_seconds|process_network_receive_bytes_total|process_network_transmit_bytes_total|workqueue_.*|rest_client_.*|scheduler_.*|kubernetes_feature_enabled"
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudnative-pg-operator
  namespace: prometheus-operator
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - cloudnative-pg
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    # controller-runtime / workqueue metrics for the operator itself. The workqueue_* and
    # rest_client_* families are the bulk of it (449 of 899 series) and are pure plumbing, so they
    # go with tier S1; controller_runtime_* is kept because it is the real reconciliation signal.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelings:
        - action: drop
          sourceLabels:
            - __name__
          regex: "go_.*|process_cpu_seconds_total|process_open_fds|process_max_fds|process_virtual_memory_bytes|process_start_time_seconds|process_network_receive_bytes_total|process_network_transmit_bytes_total|workqueue_.*|rest_client_.*|scheduler_.*|kubernetes_feature_enabled"
