apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snmp-exporter-monitor
  namespace: prometheus-operator
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: snmp-exporter
  endpoints:
    - port: metrics
      interval: 60s
      path: /snmp
      params:
        target: [192.168.30.1]

      # This relabeling turns the target param into the instance label
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: snmp-exporter.prometheus-operator.svc.cluster.local:9116
  namespaceSelector:
    matchNames:
      - monitoring
