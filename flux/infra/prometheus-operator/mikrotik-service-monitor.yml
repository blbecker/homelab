apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mikrotik-snmp
  namespace: prometheus-operator
  labels:
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-exporter
  endpoints:
    - port: prom
      interval: 60s
      path: /snmp
      params:
        target: [192.168.30.1]
        module:
          - if_mib
          - ip_mib
          - system
          - mikrotik
      # This relabeling turns the target param into the instance label
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: snmp-exporter.prometheus-operator.svc.cluster.local:9116
  namespaceSelector:
    matchNames:
      - prometheus-operator
