apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg
  namespace: prometheus-operator
  labels:
    release: prometheus-operator
spec:
  groups:
    # One Cluster (`main`) serves ten applications: authentik, freshrss, gotify,
    # harbor, immich, linkwarden, n8n, ntfy, tranquil-pds, tududi.
    - name: cloudnative-pg.cluster
      rules:
        # A PodMonitor's job label is "<monitor-namespace>/<monitor-name>", not the bare
        # monitor name (ServiceMonitors take the job name from the Service instead), so match
        # the prefix - an exact `job="cloudnative-pg-instances"` selects nothing and the alert
        # can never fire.
        - alert: CNPGMetricsEndpointDown
          expr: up{job=~".*cloudnative-pg-instances"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Postgres instance {{ $labels.pod }} is not exporting metrics"
            description: >-
              The instance manager on {{ $labels.pod }} ({{ $labels.namespace }}) has not answered a
              scrape for 10m. Either the pod is gone or its exporter is wedged - both need looking at,
              because WAL archiving runs through this process.

        - alert: CNPGMetricsCollectionFailing
          # min, not max: during a rolling restart the instance being replaced always reports a
          # collection error for a minute or two ("the database system is shutting down") and
          # that is not worth a notification. All instances failing is.
          expr: min by (namespace, cluster) (cnpg_collector_last_collection_error) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG cannot collect metrics for {{ $labels.cluster }}"
            description: >-
              The exporter's last collection cycle failed, so every cnpg_collector_* series for
              {{ $labels.cluster }} is stale. Usually a connectivity or credential problem for the
              metrics queries, not necessarily a database outage - check `kubectl cnpg status`.

        # Wraparound is not a performance problem, it is an outage: at 2^31-1 unfrozen XIDs
        # Postgres refuses new transactions and the cluster needs an offline single-user
        # vacuum. Autovacuum normally keeps this tiny (3.0e6 here), so 1.3e9 is already
        # "something is blocking freezing" - long-running transactions, a disabled
        # autovacuum, or a replication slot holding back xmin.
        - alert: CNPGTransactionIDAgeHigh
          expr: max by (namespace) (cnpg_pg_database_xid_age) > 1.3e9
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Postgres in {{ $labels.namespace }} is approaching transaction-ID wraparound"
            description: >-
              The oldest unfrozen transaction ID is {{ $value | humanize }} - within 40% of the
              2.15e9 hard limit, above which Postgres accepts no new writes. Find the oldest
              transaction (`SELECT pid, state, xact_start FROM pg_stat_activity ORDER BY
              age(backend_xid) DESC NULLS LAST`) and let autovacuum catch up; a manual
              `VACUUM FREEZE` on the largest tables buys time.

        - alert: CNPGInstanceFenced
          expr: max by (namespace, cluster) (cnpg_collector_fencing_on) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG instance for {{ $labels.cluster }} is fenced"
            description: >-
              An instance is fenced: it is running but deliberately detached from the cluster
              (failed liveness, disk full, or a stuck start-up). Writes are not flowing to it.

    - name: cloudnative-pg.backups
      rules:
        # Backup metrics come from the Barman Cloud plugin (barman_cloud_cloudnative_pg_io_*
        # prefix); the in-core cnpg_collector_last_*_backup_timestamp gauges are deprecated.
        - alert: CNPGBackupFailed
          expr: |
            (max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp))
            and
            (time() - max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp) < 86400)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Base backup failed for {{ $labels.cluster }} in the last 24h"
            description: >-
              The most recent base backup attempt for {{ $labels.cluster }} failed and it is newer than
              the last successful one. WAL archiving may still be healthy, so recovery would work up to
              the last good base backup - re-run when convenient and check the plugin logs in the
              instance pod.

        # The schedule is weekly - `0 30 3 * * 0`, Sundays 03:30 UTC - so "too old" has to allow a
        # full week plus a day of slack; a 48h threshold fires mid-week on a healthy cluster.
        # The `> 0` guard is load-bearing: the plugin exports these gauges as 0 (not absent) until a
        # backup has ever succeeded, and `time() - 0` would otherwise make this fire forever.
        - alert: CNPGBackupTooOld
          expr: |
            max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 0
            and
            (time() - max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)) > 691200
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful base backup for {{ $labels.cluster }} in over 8 days"
            description: >-
              The weekly ScheduledBackup (Sundays 03:30 UTC) has missed at least one run: the newest
              usable base backup is more than 8 days old. Point-in-time recovery now depends on that
              stale base backup plus WAL archives. Check the ScheduledBackup status, the ObjectStore,
              and the B2 credentials/bucket.

        - alert: CNPGNoSuccessfulBaseBackup
          expr: max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.cluster }} has no successful base backup at all"
            description: >-
              The Barman Cloud plugin reports no completed base backup for {{ $labels.cluster }}, so
              there is no recoverability point: archived WAL files are useless without a base backup to
              replay them onto. Either no backup has run yet (fresh install - the first weekly run is
              Sunday 03:30 UTC, or set `immediate: true` on the ScheduledBackup) or every attempt has
              failed. Do not consider this cluster backed up until this alert clears.

        # The companion to CNPGWALArchivingStalled: that one watches the backlog, this one
        # watches the failures. Postgres retries archive_command, so a single failure is
        # noise and a *rising* failed_count is the signal (bad B2 credentials, bucket gone,
        # network). The counter is cumulative since stats reset, hence increase() and not
        # the raw value - it sits at 16 here from months of retries and means nothing today.
        - alert: CNPGWALArchiveFailing
          expr: max by (namespace) (increase(cnpg_pg_stat_archiver_failed_count[1h])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving failed in the last hour in {{ $labels.namespace }}"
            description: >-
              {{ $value | humanize }} archive_command invocations failed in the past hour. While
              they keep failing, the WAL archive stops advancing and any restore becomes limited
              to the last successfully archived segment - the base backups are fine but the
              point-in-time window is shrinking. Check the instance logs for the plugin's error
              text and the ObjectStore credentials/bucket.

        - alert: CNPGWALArchivingStalled
          expr: max by (namespace, cluster) (cnpg_collector_pg_wal_archive_status{value="ready"}) > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving is falling behind for {{ $labels.cluster }}"
            description: >-
              More than 10 WAL segments have been waiting in pg_wal/archive_status for 30m. If this keeps
              growing, the archive_command is failing (plugin, endpoint or credentials) and PITR
              recoverability is sliding backwards. Check `kubectl cnpg status` for the archiving condition.
