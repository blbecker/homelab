apiVersion: apps/v1
kind: Deployment
metadata:
  name: peanut
  namespace: peanut
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: peanut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peanut
    spec:
      securityContext:
        readOnlyRootFilesystem: false

      initContainers:
      - name: config-subst
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - apk add --no-cache gettext && envsubst < /config-template/settings.yml >
          /config/settings.yml
        envFrom:
        - secretRef:
            name: peanut-secrets
        volumeMounts:
        - name: config-template
          mountPath: /config-template
          readOnly: true
        - name: config
          mountPath: /config

      containers:
      - name: peanut
        image: brandawg93/peanut:6.1.2
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: peanut-env
        env:
        - name: WEB_PORT
          value: "8080"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

      volumes:
      - name: config-template
        configMap:
          name: peanut-config
          items:
          - key: settings.yml
            path: settings.yml
      - name: config
        emptyDir: {}
