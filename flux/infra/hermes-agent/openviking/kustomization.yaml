apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - openviking-pvc.yml
  - deployment.yml
  - service.yml
  - httproute.yml
configMapGenerator:
  - name: openviking-config
    files:
      - files/ov.conf.json
generatorOptions:
  disableNameSuffixHash: true