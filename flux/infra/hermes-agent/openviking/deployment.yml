apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openviking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openviking
    spec:
      securityContext:
        readOnlyRootFilesystem: false
      containers:
        - name: openviking
          image: ghcr.io/volcengine/openviking:latest
          imagePullPolicy: Always
          env:
            - name: OPENVIKING_CONFIG_FILE
              value: /app/.openviking/ov.conf
            - name: OPENVIKING_WITH_BOT
              value: "1"
          securityContext:
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 1933
              protocol: TCP
          volumeMounts:
            - mountPath: /app/.openviking/ov.conf
              name: config
              subPath: ov.conf
            - mountPath: /app/.openviking/data
              name: data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 2Gi
              cpu: "1"
            limits:
              memory: 4Gi
              cpu: "2"
      volumes:
        - name: config
          secret:
            secretName: openviking-config
            items:
              - key: ov.conf
                path: ov.conf
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data