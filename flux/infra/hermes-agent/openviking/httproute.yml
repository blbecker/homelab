apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openviking-web-route
  namespace: hermes-agent
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik
  hostnames:
    - openviking.tartarus.us
  rules:
    - backendRefs:
        - name: openviking
          port: 1933