apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent-view
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: hermes-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
