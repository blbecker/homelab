apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw-agent
  namespace: openclaw-operator
spec:
  image:
    repository: ghcr.io/blbecker/openclaw-matrix
    tag: "0.1.13"
  config:
    configMapRef:
      name: openclaw-agent-config
      key: openclaw.json
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
  skills:
    - github
    - gog
    - summarize
    - joargp/news-summary
  extraVolumes:
    - name: secret-files
      secret:
        secretName: openclaw-agent-secret-files
  extraVolumeMounts:
    - mountPath: /home/openclaw/.config/ntfy/client.yml
      subPath: client.yml
      name: secret-files
      readOnly: true

  chromium:
    enabled: true
    image:
      repository: ghcr.io/browserless/chromium
      tag: "v2.43.0"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    # Pass extra flags to the Chromium process (appended to built-in anti-bot defaults)
    extraArgs:
      - "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    # Inject extra environment variables into the sidecar
    extraEnv:
      - name: DEFAULT_STEALTH
        value: "true"
    persistence:
      enabled: true
      storageClass: longhorn
      size: "1Gi"
