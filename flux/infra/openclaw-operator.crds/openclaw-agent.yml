apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw-agent
  namespace: openclaw-operator
spec:
  image:
    repository: ghcr.io/blbecker/openclaw-matrix
    tag: ae82e42
    pullPolicy: Always
  config:
    configMapRef:
      name: openclaw-agent-config
      key: openclaw.json
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
