apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw-agent
  namespace: openclaw-operator
spec:
  config:
    configMapRef:
      name: openclaw-agent-config
      key: openclaw.json
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  skills:
    - "npm:@vector-im/matrix-bot-sdk"
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
