apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: influxdb
resources:
  - deployment-api.yml
  - deployment-web.yml 
  - httproute-api.yml 
  - httproute-web.yml 
  - pvc.yml 
  - service-api.yml 
  - service-web.yml

configMapGenerator:
  - name: influxdb-explorer-config
    files:
      - config.json=files/explorer-config.json
generatorOptions:
  disableNameSuffixHash: true
