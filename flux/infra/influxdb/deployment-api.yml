apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb-api
  namespace: influxdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: influxdb-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb-api
    spec:
      securityContext:
        fsGroup: 1500
        fsGroupChangePolicy: Always
      initContainers:
        - name: init-volume-permissions
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 1500:1500 /var/lib/influxdb3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb3
      containers:
        - name: influxdb
          image: influxdb:3.12.1-core
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/Puerto_Rico"
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: INFLUXDB3_NODE_ID
              value: influxdb
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: influxdb-admin
                  key: admin_username
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: influxdb-admin
                  key: admin_password
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: tartarus
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: default
          securityContext:
            readOnlyRootFilesystem: false
            runAsUser: 1500
            runAsGroup: 1500
          ports:
            - name: influxdb-api
              containerPort: 8181
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/influxdb3
              name: influxdb-data
          resources:
            requests:
              memory: "250M"
              cpu: "250m"
            limits:
              memory: "2G"
              cpu: "2"
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: influxdb-data
