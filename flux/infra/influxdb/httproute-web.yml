
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb-web-route
  namespace: influxdb
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik

  hostnames:
    - influxdb-explorer.tartarus.us

  rules:

    - backendRefs:
      - name: influxdb-web
        port: 8080
