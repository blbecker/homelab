apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-cert
  namespace: harbor
spec:
  # secretName doesn't have to match the certificate name, but it may as well, for simplicity!
  secretName: harbor-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "harbor.tartarus.us"
