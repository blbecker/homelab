apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main
  namespace: cloudnative-pg
spec:
  instances: 3

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17
  postgresql:
    shared_preload_libraries: # load vchord shared library
      - "vchord"

  storage:
    storageClass: longhorn-no-replication
    size: 10Gi

  walStorage:
    storageClass: longhorn-no-replication
    size: 10Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  managed:
    roles:
      - name: awx
        ensure: present
        comment: Ansible AWX (Tower)
        login: true
        superuser: false
        passwordSecret:
          name: awx-pg-user-creds

      - name: gotify
        ensure: present
        comment: Gotify notification server
        login: true
        superuser: false
        passwordSecret:
          name: gotify-pg-user-creds

      - name: immich
        ensure: present
        comment: immich photo server
        login: true
        superuser: true
        passwordSecret:
          name: immich-pg-user-creds
