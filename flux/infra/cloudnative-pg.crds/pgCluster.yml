apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main
  namespace: cloudnative-pg
spec:
  instances: 3

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.5
  postgresql:
    shared_preload_libraries: # load vchord shared library
      - "vchord"

  storage:
    storageClass: longhorn-no-replication
    size: 5Gi

  walStorage:
    storageClass: longhorn-no-replication
    size: 5Gi

  # see https://cloudnative-pg.io/documentation/1.22/kubernetes_upgrade/
  nodeMaintenanceWindow:
    reusePVC: false # rebuild from other replica instead

  # Backups through the Barman Cloud CNPG-I plugin (chart plugin-barman-cloud,
  # store barman-cloud-objectstore.yml). isWALArchiver turns on continuous WAL
  # shipping, which is what makes point-in-time recovery possible; nightly base
  # backups are scheduled by barman-cloud-scheduledbackup.yml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: b2-postgres-backups

  # Run base backups on a standby rather than the primary when possible.
  backup:
    target: prefer-standby

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  managed:
    roles:
      - name: authentik
        ensure: present
        comment: Authentik server
        login: true
        superuser: false
        passwordSecret:
          name: authentik-pg-user-creds

      - name: freshrss
        ensure: present
        comment: Freshrss server
        login: true
        superuser: false
        passwordSecret:
          name: freshrss-pg-user-creds

      - name: gotify
        ensure: present
        comment: Gotify notification server
        login: true
        superuser: false
        passwordSecret:
          name: gotify-pg-user-creds

      - name: harbor
        ensure: present
        comment: Harbor
        login: true
        superuser: false
        passwordSecret:
          name: harbor-pg-user-creds

      - name: linkwarden
        ensure: present
        comment: Linkwarden server
        login: true
        superuser: false
        passwordSecret:
          name: linkwarden-pg-user-creds

      - name: ntfy
        ensure: present
        comment: ntfy.sh notification server
        login: true
        superuser: false
        passwordSecret:
          name: ntfy-pg-user-creds
      
      - name: n8n
        ensure: present
        comment: n8n automation server
        login: true
        superuser: false
        passwordSecret:
          name: n8n-pg-user-creds

      - name: immich
        ensure: present
        comment: immich photo server
        login: true
        superuser: true
        passwordSecret:
          name: immich-pg-user-creds

      - name: tranquil-pds
        ensure: present
        comment: tranquil-pds server
        login: true
        superuser: false
        passwordSecret:
          name: tranquil-pds-pg-user-creds

      - name: tududi
        ensure: present
        comment: tududi server
        login: true
        superuser: false
        passwordSecret:
          name: tududi-pg-user-creds
