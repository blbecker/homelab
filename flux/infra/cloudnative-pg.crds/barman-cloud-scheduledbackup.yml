apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: main-nightly
  namespace: cloudnative-pg
spec:
  # CloudNativePG cron format carries a leading seconds field:
  # "0 30 3 * * *" = every day at 03:30:00 (server time, UTC).
  schedule: "0 30 3 * * *"
  cluster:
    name: main
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  backupOwnerReference: self
  immediate: false
  suspend: false
