apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cloudnative-pg
spec:
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: plugin-barman-cloud
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    # The plugin must live in the same namespace as the CloudNativePG operator
    # (which runs with clusterWide: false here), so this is namespace-local too.
    replicaCount: 1
    logLevel: info

    # The chart issues its own TLS certificates through cert-manager
    # (self-signed Issuer by default) - cert-manager is already installed.
    certificate:
      createIssuer: true
      duration: 2160h
      renewBefore: 360h

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

    # Metrics: the plugin's backup/WAL metrics are emitted by the *instance
    # manager* exporter on each Postgres pod (:9187), not by this deployment, so
    # they are scraped via the cloudnative-pg-instances PodMonitor in
    # flux/infra/prometheus-operator/pod-monitors/cloudnative-pg.yml.
    # The chart exposes no ServiceMonitor/PodMonitor of its own.
