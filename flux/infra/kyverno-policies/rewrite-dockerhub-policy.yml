apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: rewrite-dockerhub-to-harbor
spec:
  evaluation:
    admission:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              containers:
                has(object.spec.containers) ?
                object.spec.containers.map(c,
                  Object.spec.containers{
                    name: c.name,
                    image:
                      c.image.startsWith("docker.io/") ?
                      "harbor.tartarus.us/dockerhub_proxy/" + c.image.substring(11) :
                      c.image
                  }
                ) : []
            }
          }
