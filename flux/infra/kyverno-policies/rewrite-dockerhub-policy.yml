apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: rewrite-dockerhub-to-harbor
spec:
  evaluation:
    admission:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{

              containers:
                object.spec.containers.map(c,
                  Object.spec.containers{
                    name: c.name,
                    image:
                      c.image.startsWith("docker.io/") ?
                      "harbor.tartarus.us/dockerhub-proxy/" + c.image.substring(10) :
                      c.image
                  }
                ),

              initContainers:
                object.spec.initContainers.map(c,
                  Object.spec.initContainers{
                    name: c.name,
                    image:
                      c.image.startsWith("docker.io/") ?
                      "harbor.tartarus.us/dockerhub-proxy/" + c.image.substring(10) :
                      c.image
                  }
                ),

              ephemeralContainers:
                object.spec.ephemeralContainers.map(c,
                  Object.spec.ephemeralContainers{
                    name: c.name,
                    image:
                      c.image.startsWith("docker.io/") ?
                      "harbor.tartarus.us/dockerhub-proxy/" + c.image.substring(10) :
                      c.image
                  }
                )
            }
          }
