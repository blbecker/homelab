apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freshrss-web-route
  namespace: freshrss
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik

  hostnames:
    - freshrss.tartarus.us

  rules:
    - backendRefs:
        - name: freshrss
          port: 80
