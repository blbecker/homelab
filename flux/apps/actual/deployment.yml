apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual
    spec:
      securityContext:
        readOnlyRootFilesystem: false
        # runAsUser: 2000
        # runAsGroup: 2000
        # fsGroup: 2000
        # fsGroupChangePolicy: "Always"
      containers:
        - name: actual
          image: louislam/uptime-kuma:1.23.17-alpine
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/New_York"
            - name: PUID
              value: "2000"
            - name: PGID
              value: "2000"
          ports:
            - name: actual
              containerPort: 5006
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data
              name: actual-config
          resources:
            requests:
              memory: "500M"
              cpu: "250m"
            limits:
              memory: "500M"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: actual
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: actual
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: actual
            failureThreshold: 30
            periodSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      volumes:
        - name: actual-config
          persistentVolumeClaim:
            claimName: actual-config
