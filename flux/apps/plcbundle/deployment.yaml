apiVersion: apps/v1
kind: Deployment
metadata:
  name: plcbundle
  namespace: plcbundle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plcbundle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plcbundle
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        readOnlyRootFilesystem: true
      containers:
        - name: plcbundle
          image: atscan/plcbundle:v0.4.12
          command: ["plcbundle"]
          args:
            - "serve"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--sync"
            - "--websocket"
          env:
            - name: TZ
              value: "America/New_York"
          podSecurityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "Always"
          ports:
            - name: plcbundle
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: plcbundle

          # livenessProbe:
          #   tcpSocket:
          #     port: plcbundle
          #   initialDelaySeconds: 60
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /status
          #     port: plcbundle
          #   initialDelaySeconds: 10
          #   timeoutSeconds: 5
          resources:
            requests:
              memory: "2G"
              cpu: "1"
            limits:
              memory: "2G"
      volumes:
        - name: plcbundle
          persistentVolumeClaim:
            claimName: plcbundle
