- Infra:
  - Backrest:
      href: https://backrest.tartarus.us
      description: Backrest backups
      icon: backrest
      widget:
        type: backrest 
        url: https://backrest.tartarus.us
        username: {{HOMEPAGE_VAR_BACKREST_USERNAME}}
        password: {{HOMEPAGE_VAR_BACKREST_PASSWORD}}
  - Cloudflared:
      href: https://cloudflare.com 
      description: Cloudflare tunnels 
      icon: cloudflare
      widget:
        type: cloudflared 
        accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNTID}}
        tunnelid: 2a3d2a8b-ccac-4bf4-8e6e-357d25235a98
        key: {{HOMEPAGE_VAR_CLOUDFLARE_KEY}}
  - Mikrotik Gateway:
      href: http://router.tartarus.us
      description: Mikrotik gateway
      icon: mikrotik
      widget:
        type: mikrotik 
        url: http://192.168.40.1
        username: {{HOMEPAGE_VAR_MIKROTIK_GATEWAY_USERNAME}}
        password: {{HOMEPAGE_VAR_MIKROTIK_GATEWAY_PASSWORD}}
  - NextDNS:
      href: https://my.nextdns.io 
      description: DNS Provider
      icon: nextdns
      widget: 
        type: nextdns 
        profile: 8edf13
        key: {{HOMEPAGE_VAR_NEXTDNS_KEY}}
  - QNAP: 
      href: https://nas.tartarus.us 
      description: NAS Device 
      icon: qnap
      widget: 
        type: qnap 
        url: https://nas.tartarus.us 
        username: {{HOMEPAGE_VAR_QNAP_USERNAME}}
        password: {{HOMEPAGE_VAR_QNAP_PASSWORD}}
  - Syncthing:
      href: https://syncthing.tartarus.us 
      description: File sync 
