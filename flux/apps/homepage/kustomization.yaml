apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - clusterbinding.yml 
  - clusterrole.yml 
  - deployment.yml 
  - dnsendpoint.yml 
  - env-configmap.yml 
  - secret.yml 
  - service.yml 
  - serviceaccount.yml

configMapGenerator:
  - name: homepage-config
    files:
      - files/bookmarks.yaml 
      - files/custom.css 
      - files/custom.js 
      - files/docker.yaml 
      - files/kubernetes.yaml 
      - files/proxmox.yaml 
      - files/services.yaml 
      - files/settings.yaml
      - files/widgets.yaml
