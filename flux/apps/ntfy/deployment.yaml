apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 20000
        fsGroupChangePolicy: "Always"
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.27
          imagePullPolicy: Always
          args:
            - serve
          env:
            - name: TZ
              value: "America/Puerto_Rico"
          envFrom:
            - secretRef:
                name: ntfy-secrets

          ports:
            - name: ntfy
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/ntfy
              readOnly: true
              name: config
            - mountPath: /var/cache/ntfy/attachments
              name: attachments
          securityContext:
            runAsUser: 20000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
                - NET_RAW

          livenessProbe:
            tcpSocket:
              port: ntfy
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: ntfy
            initialDelaySeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "500M"
              cpu: "1"
            limits:
              memory: "500M"
              cpu: "1"
      volumes:
        - name: config
          configMap:
            name: ntfy-configmap
        - name: attachments
          emptyDir:
            sizeLimit: 1Gi
