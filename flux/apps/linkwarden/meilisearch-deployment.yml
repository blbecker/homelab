apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden-meilisearch
  namespace: linkwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: linkwarden-meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkwarden-meilisearch
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meilisearch
          image: docker.io/getmeili/meilisearch:v1.56.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: TZ
              value: America/Puerto_Rico
          envFrom:
            - secretRef:
                name: linkwarden-secrets
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          volumeMounts:
            - mountPath: /meili_data
              name: meilisearch-data
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: linkwarden-meilisearch
