apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkwarden-web-route
  namespace: linkwarden
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik

  hostnames:
    - linkwarden.tartarus.us

  rules:
    - backendRefs:
        - name: linkwarden
          port: 80
