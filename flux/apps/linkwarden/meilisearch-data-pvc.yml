apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-meilisearch
  namespace: linkwarden
  annotations:
    nfs.io/storage-path: "linkwarden-meilisearch"
spec:
  storageClassName: qnap-fixed-name-nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
