apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  chartRef:
    kind: OCIRepository
    name: bitnami-wordpress
    namespace: flux-system
  interval: 5m
  timeout: 5m
  releaseName: wordpress
  values: # https://github.com/bitnami/charts/blob/main/bitnami/wordpress/values.yaml
    multisite:
      enable: true
      host: wordpress.tartarus.us
      networkType: subdomain
    persistence:
      enabled: true
      existingClaim: wordpress-data
    service:
      type: ClusterIP
    memcached:
      enabled: true
    mariadb:
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 10Gi
