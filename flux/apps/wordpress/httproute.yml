apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress-web-route
  namespace: wordpress
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik

  hostnames:
    - wordpress.tartarus.us

  rules:
    - backendRefs:
        - name: wordpress
          port: 80
