apiVersion: v1
kind: Service
metadata:
  name: authentik
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik
  ports:
    - name: authentik-http
      port: 9000
      targetPort: authentik-http
      protocol: TCP
    - name: authentik-https
      port: 9443
      targetPort: authentik-https
      protocol: TCP
