apiVersion: apps/v1
kind: Deployment
metadata:
  name: tududi
  namespace: tududi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tududi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tududi
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        # tududi's image defaults to PUID/PGID 1001 (user "app")
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tududi
          image: docker.io/chrisvel/tududi:1.15.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tududi-config
            - secretRef:
                name: tududi-secrets
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          volumeMounts:
            - mountPath: /app/db
              name: tududi-data
            - mountPath: /data/uploads
              name: tududi-uploads
            - mountPath: /tmp
              name: tmp-volume
          securityContext:
            # the image entrypoint chowns /app/{db,backups} and drops
            # privileges with su-exec, so it must start as root and keep a
            # writable root filesystem (no runAsUser / readOnlyRootFilesystem)
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: tududi-data
          persistentVolumeClaim:
            claimName: tududi-data
        - name: tududi-uploads
          persistentVolumeClaim:
            claimName: tududi-uploads
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
