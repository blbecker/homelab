apiVersion: apps/v1
kind: Deployment
metadata:
  name: tududi
  namespace: tududi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tududi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tududi
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        # tududi's image defaults to PUID/PGID 1001 (user "app")
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tududi
          image: docker.io/chrisvel/tududi:1.14.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: TZ
              value: "America/Puerto_Rico"
            # initial admin account, created on first startup only
            - name: TUDUDI_USER_EMAIL
              value: "tududi.admin@mail.bckr.me"
            # public URLs: needed for OIDC callbacks and generated links
            - name: BASE_URL
              value: "https://tududi.tartarus.us"
            - name: FRONTEND_URL
              value: "https://tududi.tartarus.us"
            - name: BACKEND_URL
              value: "https://tududi.tartarus.us"
            # CORS allowlist for the public origin
            - name: TUDUDI_ALLOWED_ORIGINS
              value: "https://tududi.tartarus.us"
            # required behind Traefik, otherwise sessions break after login
            - name: TUDUDI_TRUST_PROXY
              value: "true"
            # SQLite on the Longhorn volume, attachments on the NFS volume.
            # The DB lives in /app/db (chowned by the image entrypoint, which
            # works on Longhorn). Uploads deliberately live OUTSIDE /app:
            # the QNAP NFS export squashes root, so the entrypoint's
            # `chown -R app:app /app/uploads` fails with EPERM and, under
            # `set -eu`, aborts the container before the app starts. Mounting
            # the share at /data/uploads keeps it off that chown path.
            - name: DB_FILE
              value: "/app/db/production.sqlite3"
            - name: TUDUDI_UPLOAD_PATH
              value: "/data/uploads"
          envFrom:
            - secretRef:
                name: tududi-secrets
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          volumeMounts:
            - mountPath: /app/db
              name: tududi-data
            - mountPath: /data/uploads
              name: tududi-uploads
            - mountPath: /tmp
              name: tmp-volume
          securityContext:
            # the image entrypoint chowns /app/{db,backups} and drops
            # privileges with su-exec, so it must start as root and keep a
            # writable root filesystem (no runAsUser / readOnlyRootFilesystem)
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: tududi-data
          persistentVolumeClaim:
            claimName: tududi-data
        - name: tududi-uploads
          persistentVolumeClaim:
            claimName: tududi-uploads
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
