apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuwuity
  namespace: continuwuity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: continuwuity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: continuwuity
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: "Always"
        readOnlyRootFilesystem: true
      containers:
        - name: continuwuity
          image: forgejo.ellis.link/continuwuation/continuwuity:v0.5.10-maxperf
          env:
            - name: TZ
              value: "America/Puerto_Rico"
          envFrom:
            - configMapRef:
                name: continuwuity-configmap
            - secretRef:
                name: continuwuity-secrets
          ports:
            - name: continuwuity
              containerPort: 6167
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: data

          livenessProbe:
            tcpSocket:
              port: continuwuity
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_matrix/federation/v1/version
              port: continuwuity
            initialDelaySeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "2048Mi"
              cpu: "1"
            limits:
              memory: "3000Mi"
              cpu: "4"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: continuwuity-data
