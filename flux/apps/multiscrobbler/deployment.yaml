apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiscrobbler
  namespace: multiscrobbler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multiscrobbler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multiscrobbler
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        readOnlyRootFilesystem: true
      containers:
        - name: multiscrobbler
          image: foxxmd/multi-scrobbler
          env:
            - name: TZ
              value: "America/Puerto_Rico"
          envFrom:
            - configMapRef:
                name: multiscrobbler-configmap
            - secretRef:
                name: multiscrobbler-secrets
          podSecurityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "Always"
          ports:
            - name: multiscrobbler
              containerPort: 9078
              protocol: TCP
          volumeMounts:
            - mountPath: /config
              name: multiscrobbler-config

          livenessProbe:
            tcpSocket:
              port: multiscrobbler
            initialDelaySeconds: 30
            periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: multiscrobbler
          #   initialDelaySeconds: 10
          #   timeoutSeconds: 5
          resources:
            requests:
              memory: "100M"
              cpu: ".1"
            limits:
              memory: "200M"
              cpu: ".2"
      volumes:
        - name: multiscrobbler-config
          persistentVolumeClaim:
            claimName: multiscrobbler-config
