apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-web-route
  namespace: jellyfin
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik

  hostnames:
    - jellyfin.tartarus.us

  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
