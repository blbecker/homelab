apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
spec:
  replicas: 1
  # Single Rails pod with embedded Sidekiq: keep one pod at a time so two
  # release tasks never run migrations concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dawarich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dawarich
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Mirrors upstream's 60s stop_grace_period so running jobs can finish or
      # return to the queue instead of being killed mid-import.
      terminationGracePeriodSeconds: 60
      containers:
        - name: dawarich
          image: freikin/dawarich:1.23.0
          imagePullPolicy: IfNotPresent
          # The image's ENTRYPOINT is `bundle exec`; upstream compose runs
          # web-entrypoint.sh (DB migrate + data:migrate + seed + static asset
          # sync, then `exec bundle exec "$@"`) with the Rails server as the
          # command, so mirror that exactly. Bind 0.0.0.0 rather than compose's
          # `::` so kubelet probes and the Service reach it over IPv4.
          command:
            - web-entrypoint.sh
          args:
            - bin/rails
            - server
            - -p
            - "3000"
            - -b
            - 0.0.0.0
          envFrom:
            - configMapRef:
                name: dawarich-config
            - secretRef:
                name: dawarich-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9394
              protocol: TCP
          volumeMounts:
            # Rails public/: compiled assets + poster themes, wiped and
            # re-synced from the image on every boot (web-entrypoint.sh), and
            # nothing user-generated is written here -- so pod-local scratch,
            # not a PVC and not NFS churn.
            - mountPath: /var/app/public
              name: public
            # ActiveStorage blobs (imported photos, exports).
            - mountPath: /var/app/storage
              name: storage
            # Import drop folder. We import through the UI instead, so this is
            # only here to give the hourly Import::WatcherJob a real, empty
            # directory to scan: without the mount, Dir.entries raises ENOENT
            # once an hour (the job sets retry: false, so it shows as a failed
            # job each time).
            - mountPath: /var/app/tmp/imports/watched
              name: watched
          securityContext:
            # The entrypoint runs `rails db:migrate`, `rake data:migrate`,
            # `rails db:seed` and the public-asset sync on every start, and the
            # image ships no USER (runs as root); PUID/PGID are deliberately
            # left unset so it never chowns the NFS watched volume.
            allowPrivilegeEscalation: false
          # First boot does migrations plus the country-geometry seed, which is
          # slow: allow up to 15 minutes before the probes take over.
          # startupProbe:
          #   httpGet:
          #     path: /api/v1/health
          #     port: http
          #   periodSeconds: 10
          #   failureThreshold: 90
          # livenessProbe:
          #   httpGet:
          #     path: /api/v1/health
          #     port: http
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          # readinessProbe:
          #   httpGet:
          #     path: /api/v1/health
          #     port: http
          #   periodSeconds: 10
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: public
          emptyDir:
            sizeLimit: 512Mi
        - name: storage
          persistentVolumeClaim:
            claimName: dawarich-storage
        - name: watched
          emptyDir:
            sizeLimit: 512Mi
