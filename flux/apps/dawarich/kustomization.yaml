apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dawarich
resources:
  - ./dawarich-storage-pvc.yml
  - ./deployment.yml
  - ./dnsendpoint.yml
  - ./service.yml

# Non-secret runtime configuration: `envs` renders one ConfigMap key per
# KEY=VALUE line in files/dawarich.env, consumed by the Deployment via envFrom.
# Do NOT quote values in the env file -- kustomize keeps the quotes.
configMapGenerator:
  - name: dawarich-config
    envs:
      - files/dawarich.env
# Name-suffix hash deliberately LEFT ON: kustomize's nameReference transformer
# rewrites the Deployment's envFrom.configMapRef.name to the hashed name, so an
# env change alters the pod template and the Deployment rolls itself. Do not add
# disableNameSuffixHash here -- it silently turns config edits into no-ops until
# someone restarts the pod by hand (secrets under flux/infra/secrets are plain
# resources and still need a manual rollout).
