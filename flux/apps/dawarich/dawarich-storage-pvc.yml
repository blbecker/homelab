apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-storage
  namespace: dawarich
  # Rails ActiveStorage (imported photos, archives, exports). Plain files written
  # through ActiveStorage's DiskService (tmpfile + rename, no POSIX locks, no
  # mmap), so the QNAP array -- not Longhorn -- is the right home: it is the big
  # array, it already gets the host-level backup treatment, and ReadWriteMany
  # means splitting Sidekiq into its own Deployment later needs no PVC change.
  # Same shape as immich's photo library.
  annotations:
    nfs.io/storage-path: "dawarich-storage"
spec:
  storageClassName: qnap-fixed-name-nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
