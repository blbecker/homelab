apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-public
  namespace: dawarich
  # Rails public/ directory: compiled assets re-synced from the image on every
  # boot, plus anything the app writes there. Fully regenerable, so no Longhorn
  # recurring snapshots. ReadWriteOnce, single pod.
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
