apiVersion: v1
kind: Service
metadata:
  name: dawarich
  namespace: dawarich
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dawarich
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9394
      targetPort: metrics
      protocol: TCP
