apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny
  namespace: cinny
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cinny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinny
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: "Always"
        readOnlyRootFilesystem: true
      containers:
        - name: cinny
          image: ajbura/cinny:v4.10.5
          env:
            - name: TZ
              value: "America/Puerto_Rico"
          ports:
            - name: cinny
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /app/config.json
              subPath: config.json
              name: config

          livenessProbe:
            tcpSocket:
              port: cinny
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login/bckr.me
              port: cinny
            initialDelaySeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "500M"
              cpu: "1"
            limits:
              memory: "500M"
              cpu: "1"
      volumes:
        - name: config
          configMap:
            name: cinny-configmap
